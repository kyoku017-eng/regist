<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>受講登録 管理サイト 15.2 - 2026年度</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;--success:#10b981;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#ef4444;--danger-bg:#fef2f2;--text:#1e293b;--text-muted:#64748b;--bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--sidebar-w:230px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:var(--primary);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.topbar-title{font-size:16px;font-weight:700;}
.topbar-title span{font-size:11px;background:rgba(255,255,255,.25);border-radius:4px;padding:2px 8px;margin-left:8px;}
.topbar-actions{display:flex;gap:8px;}
.tb-btn{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
.tb-btn:hover{background:rgba(255,255,255,.15);}
.tb-btn.save{background:#fff;color:var(--primary);}
.body-wrap{display:flex;flex:1;overflow:hidden;}
.sidebar{width:var(--sidebar-w);background:#1e293b;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-section{padding:8px 0;}
.sidebar-label{font-size:10px;font-weight:700;color:#64748b;letter-spacing:.08em;padding:6px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:#94a3b8;font-size:13px;font-weight:600;border-left:3px solid transparent;transition:.15s;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#cbd5e1;}
.nav-item.active{background:rgba(37,99,235,.25);color:#60a5fa;border-left-color:#2563eb;}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:#334155;color:#94a3b8;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;}
.nav-item.active .nav-badge{background:rgba(37,99,235,.4);color:#93c5fd;}
.nav-badge.warn{background:#92400e;color:#fef3c7;}
.main{flex:1;overflow-y:auto;padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.stat-card .num{font-size:28px;font-weight:800;color:var(--primary);}
.stat-card .label{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:2px;}
.stat-card.green .num{color:var(--success);}
.stat-card.orange .num{color:var(--warning);}
.stat-card.red .num{color:var(--danger);}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#f8fafc;}
th{padding:10px 12px;text-align:left;font-weight:700;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.tbl-actions{display:flex;gap:6px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.badge-blue{background:var(--primary-light);color:var(--primary-dark);}
.badge-green{background:var(--success-bg);color:#047857;}
.badge-orange{background:var(--warning-bg);color:#92400e;}
.badge-red{background:var(--danger-bg);color:#991b1b;}
.badge-purple{background:#f3e8ff;color:#6b21a8;}
.badge-gray{background:#f1f5f9;color:#475569;}
.btn{border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5;}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-sm{padding:4px 10px;font-size:11px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:12px;font-weight:700;color:var(--text-muted);}
.form-group input,.form-group select,.form-group textarea{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color .2s;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);}
.form-group textarea{resize:vertical;min-height:70px;}
.auto-label-preview{background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:4px 10px;font-size:12px;color:#047857;font-weight:700;margin-top:4px;display:none;}
.auto-label-preview.show{display:block;}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:#fff;}
.checkbox-item{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer;padding:2px 8px;border-radius:6px;border:1px solid var(--border);background:#fff;transition:.15s;}
.checkbox-item.checked{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-xl{max-width:960px;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;}
.modal-title{font-size:16px;font-weight:700;}
.modal-body{padding:20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1;}
.schedule-grid{display:grid;grid-template-columns:80px repeat(6,1fr);gap:4px;font-size:11px;}
.sg-header{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:6px;text-align:center;font-weight:700;color:var(--text-muted);}
.sg-row-label{background:#1e293b;color:#94a3b8;border-radius:6px;padding:6px 8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.sg-cell{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:6px;min-height:80px;cursor:pointer;transition:.15s;position:relative;}
.sg-cell:hover{border-color:var(--primary);background:var(--primary-light);}
.sg-cell .add-btn{position:absolute;bottom:4px;right:4px;width:20px;height:20px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;opacity:0;transition:.15s;}
.sg-cell:hover .add-btn{opacity:1;}
.sg-chip{display:inline-flex;align-items:center;gap:3px;background:#f1f5f9;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin:1px;font-size:10px;font-weight:600;max-width:100%;cursor:grab;}
.sg-chip:hover{background:var(--danger-bg);border-color:#fca5a5;color:var(--danger);}
.sg-chip.sync-xy{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;}
.sg-chip.sync-consec{background:#d1fae5;border-color:#34d399;color:#065f46;}
.sg-chip.odd{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;}
.sg-chip.even{background:#fff7ed;border-color:#fed7aa;color:#c2410c;}
.sg-chip.dragging{opacity:.35;cursor:grabbing;transform:scale(.92);}
.sg-cell.drag-over{border-color:var(--primary)!important;background:var(--primary-light)!important;box-shadow:inset 0 0 0 2.5px var(--primary);}
.sg-cell.drag-over-invalid{border-color:var(--danger)!important;background:var(--danger-bg)!important;box-shadow:inset 0 0 0 2.5px var(--danger);}
.search-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-input{border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;flex:1;min-width:200px;}
.search-input:focus{border-color:var(--primary);}
.filter-select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;outline:none;background:#fff;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state .icon{font-size:40px;margin-bottom:10px;}
.json-preview{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:16px;font-family:monospace;font-size:11px;max-height:300px;overflow-y:auto;white-space:pre;}
.page-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.page-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.prereq-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;background:#fff;}
.prereq-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.tabs-modal{display:flex;background:#e2e8f0;padding:3px;border-radius:10px;margin-bottom:16px;}
.tab-btn{flex:1;text-align:center;padding:7px 4px;font-size:12px;font-weight:700;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--text-muted);}
.tab-btn.active{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.1);}
.subject-cat-block{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.subject-cat-title{background:#f1f5f9;padding:6px 12px;font-size:12px;font-weight:700;color:#475569;}
.subject-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #f8fafc;transition:background .1s;}
.subject-row:last-child{border-bottom:none;}
.subject-row:hover{background:#f8fafc;}
.subject-row.completed{background:#f0fdf4;}
.subject-row.uncertified{background:#fef2f2;}
.subject-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);}
.subject-row .subj-name{flex:1;font-size:13px;font-weight:600;}
.subject-row .subj-units{font-size:11px;color:var(--text-muted);background:#f1f5f9;padding:1px 6px;border-radius:4px;}
.cert-toggle{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;border:1.5px solid;cursor:pointer;}
.cert-toggle.certified{background:var(--success-bg);color:#047857;border-color:#86efac;}
.cert-toggle.uncertified{background:var(--danger-bg);color:#991b1b;border-color:#fca5a5;}
.req-check-item{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:12px;}
.req-check-item.ok{background:var(--success-bg);border:1px solid #86efac;}
.req-check-item.ng{background:var(--danger-bg);border:1px solid #fca5a5;}
.req-check-item.warn{background:var(--warning-bg);border:1px solid #fcd34d;}
.req-check-item.urgent{border-color:var(--danger);border-width:2px;}
.req-check-item .req-name{font-weight:700;min-width:120px;}
.req-check-item .req-detail{color:var(--text-muted);font-size:11px;margin-top:2px;}
.pe-entry{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-bottom:4px;}
.pe-entry .pe-units{width:55px;text-align:center;border:1.5px solid var(--border);border-radius:6px;padding:4px;font-size:13px;font-weight:700;}
.pe-entry .pe-status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid;cursor:pointer;}
.pe-total{font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;margin-bottom:8px;}
.pe-total.ok{background:var(--success-bg);color:#047857;}
.pe-total.warn{background:var(--warning-bg);color:#92400e;}
.pe-total.ng{background:var(--danger-bg);color:#991b1b;}
.undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;display:none;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.undo-bar.show{display:flex;animation:slideUpFade .2s ease-out;}
@keyframes slideUpFade{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.undo-bar .undo-btn{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.35);color:#fff;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.undo-bar .close-sm{background:transparent;border:none;color:rgba(255,255,255,.6);font-size:17px;cursor:pointer;padding:0 2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
@media(max-width:900px){.sidebar{width:56px;}.nav-item .text,.sidebar-label,.nav-badge{display:none;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">🏫 受講登録 管理サイト <span>2026年度 v15.2 - 初期データにスケジュール224件を復元</span></div>
  <div class="topbar-actions">
    <button class="tb-btn" onclick="undo()" title="Ctrl+Z で元に戻す">↩️ 元に戻す</button>
    <button class="tb-btn" onclick="runIntegrityCheck()">🔍 整合性チェック</button>
    <button class="tb-btn" onclick="exportJSON()">📤 JSON出力</button>
    <button class="tb-btn save" onclick="saveAll()">💾 保存</button>
  </div>
</div>
<div class="body-wrap">
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">メニュー</div>
      <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard"><span class="icon">📊</span><span class="text">概要ダッシュボード</span></div>
      <div class="nav-item" onclick="showPage('subjects')" id="nav-subjects"><span class="icon">📚</span><span class="text">科目マスタ</span><span class="nav-badge" id="badge-subjects">0</span></div>
      <div class="nav-item" onclick="showPage('schedule')" id="nav-schedule"><span class="icon">📅</span><span class="text">開講スケジュール</span><span class="nav-badge" id="badge-schedules">0</span></div>
      <div class="nav-item" onclick="showPage('exams')" id="nav-exams"><span class="icon">📝</span><span class="text">試験スケジュール</span><span class="nav-badge" id="badge-exams">0</span></div>
      <div class="nav-item" onclick="showPage('conditions')" id="nav-conditions"><span class="icon">📋</span><span class="text">必修・段階条件</span></div>
      <div class="nav-item" onclick="showPage('grade')" id="nav-grade"><span class="icon">🎓</span><span class="text">年次判定設定</span></div>
      <div class="nav-item" onclick="showPage('registrations')" id="nav-registrations"><span class="icon">📩</span><span class="text">受講登録データ</span><span class="nav-badge" id="badge-registrations">0</span></div>
      <div class="nav-item" onclick="showPage('students')" id="nav-students"><span class="icon">👥</span><span class="text">生徒管理</span><span class="nav-badge" id="badge-students">0</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">ツール</div>
      <div class="nav-item" onclick="showPage('export')" id="nav-export"><span class="icon">💾</span><span class="text">データ管理・出力</span></div>
    </div>
  </nav>
  <main class="main" id="main-content">読み込み中...</main>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOuter(event)">
  <div class="modal" id="modal-box"></div>
</div>
<div class="toast" id="toast"></div>
<script>

const SUBJECT_ABBR={
  "現代の国語":"現国","言語文化":"言文","論理国語":"論理国語","文学国語":"文学国語",
  "国語表現":"国語表現","古典探究":"古典探究","地理総合":"地総","歴史総合":"歴総",
  "日本史探究":"日本史探究","世界史探究":"世界史探究","公共":"公共","倫理":"倫理",
  "政治・経済":"政経","数学Ⅰ":"数学Ⅰ","数学Ⅱ":"数学Ⅱ","数学Ａ":"数学A",
  "数学Ｂ":"数学B","数学入門講座":"数学入門","物理基礎":"物理基礎","化学基礎":"化学基礎",
  "生物基礎":"生物基礎","地学基礎":"地学基礎","科学と人間生活":"科学と人間生活",
  "体育":"体育","保健":"保健","音楽Ⅰ":"音楽Ⅰ","美術Ⅰ":"美術Ⅰ","工芸Ⅰ":"工芸Ⅰ",
  "書道Ⅰ":"書道Ⅰ","英語コミュニケーションⅠ":"英語コミⅠ","英語コミュニケーションⅡ":"英語コミⅡ",
  "論理・表現Ⅰ":"論理表現Ⅰ","英語入門講座":"英語入門","家庭基礎":"家庭基礎",
  "家庭総合":"家庭総合","消費生活":"消費生活","保育基礎":"保育基礎",
  "フードデザイン":"フードデザイン","情報Ⅰ":"情報Ⅰ","ビジネス基礎":"ビジ基礎",
  "ビジネス・コミュニケーション":"ビジコミ","ビジネス法規":"ビジ法規","簿記":"簿記",
  "総合的な探究の時間":"総合探究",
};
function getAbbr(科目名){const s=getAllSubjects().find(x=>x.科目名===科目名);return(s&&s.略称)||SUBJECT_ABBR[科目名]||科目名;}
function generateLabel(科目名,parity,条件区分,minGrade,classes){
  const abbr=getAbbr(科目名),p=parity==="odd"?"(奇)":parity==="even"?"(偶)":"",hasParity=parity!=null,cls=(classes||[]).slice().sort().join("");
  let cond="";
  switch(条件区分){
    case"all":cond="";break;case"exactgrade":cond=`${minGrade}年`;break;
    case"mingrade":cond=hasParity?`${minGrade}上`:`${minGrade}年以上`;break;
    case"grade1classes":cond=`1${cls}`;break;case"grade1classes+min2":cond=`1${cls} 2年以上`;break;
    case"grade1classes+exactgrade2":cond=`1${cls} 2年`;break;default:cond="";
  }
  return`${abbr}${p}${cond}`;
}
function refreshAutoLabel(){
  const subj=document.getElementById("fs-subject")?.value||"";if(!subj)return;
  const parity=document.getElementById("fs-parity")?.value||null,cond=document.getElementById("fs-cond")?.value||"all";
  const minGradeEl=document.getElementById("fs-grade"),minGrade=minGradeEl?parseInt(minGradeEl.value):null;
  const label=generateLabel(subj,parity||null,cond,minGrade,[...selectedClasses]);
  const labelEl=document.getElementById("fs-label");
  if(labelEl){labelEl.value=label;labelEl.style.background="#f0fdf4";setTimeout(()=>labelEl.style.background="",800);}
  const preview=document.getElementById("auto-label-preview");
  if(preview){preview.textContent=`自動生成: ${label}`;preview.className="auto-label-preview show";}
}
function regenerateAllLabels(){
  const count=DB.schedules.length;if(!count){showToast("⚠️ スケジュールデータがありません");return;}
  if(!confirm(`開講スケジュール ${count} 件のラベルを略称で一括再生成します。\n手動編集済みのラベルも上書きされます。よろしいですか？`))return;
  pushUndo();let updated=0;
  DB.schedules.forEach(s=>{const newL=generateLabel(s.科目名,s.parity,s.条件区分,s.minGrade,s.classes);if(newL!==s.label){s.label=newL;updated++;}});
  saveDB();renderPage();showToast(`✅ ${updated}件のラベルを更新しました`);showUndoBar(`✨ ラベルを一括再生成しました（${updated}件更新）`);
}

function findXYPartner(item){
  const subj=getAllSubjects().find(s=>s.科目名===item.科目名);
  if(!subj?.syncXY)return null;
  const other=item.XY==="X"?"Y":"X";
  return DB.schedules.find(s=>s.id!==item.id&&s.XY===other&&s.period===item.period&&s.label===item.label)||null;
}
function findConsecPartner(item){
  const subj=getAllSubjects().find(s=>s.科目名===item.科目名);
  if(!subj?.syncConsec)return null;
  return DB.schedules.find(s=>s.id!==item.id&&s.XY===item.XY&&s.科目名===item.科目名&&Math.abs(s.period-item.period)===1)||null;
}
function findAllPartners(item){return[findXYPartner(item),findConsecPartner(item)].filter(Boolean);}

function validateStudent(student,additionalSubjects=[]){
  const 修得済み=student.修得済み科目||[];const creditMap={};
  修得済み.filter(s=>s.認定!==false).forEach(s=>{if(s.科目名==="体育"){creditMap["体育"]=(creditMap["体育"]||0)+Number(s.単位数||3);}else{creditMap[s.科目名]=Number(s.単位数||getSubjectUnits(s.科目名));}});
  additionalSubjects.forEach(sname=>{if(sname==="体育"){creditMap["体育"]=(creditMap["体育"]||0)+3;}else if(!creditMap[sname]){creditMap[sname]=getSubjectUnits(sname);}});
  const completed=new Set(Object.keys(creditMap));const peCredits=creditMap["体育"]||0;
  const reqs=(DB.requirements?.必修科目||INITIAL_REQUIREMENTS.必修科目);
  const checks=reqs.map(req=>{
    if(!req.type)return{id:req.id||"",name:req.名称||"",ok:false,detail:"⚠️ 旧形式",warning:null,urgent:false};
    switch(req.type){
      case"allOf":{const missing=req.subjects.filter(s=>!completed.has(s));return{id:req.id,name:req.名称,ok:missing.length===0,detail:req.subjects.map(s=>`${s}:${completed.has(s)?"✅":"❌"}`).join("　"),warning:null,urgent:false};}
      case"anyOf":{const found=req.subjects.filter(s=>completed.has(s));return{id:req.id,name:req.名称,ok:found.length>=(req.min||1),detail:`${found.join("・")||"未修得"}（${req.min||1}科目必要）`,warning:null,urgent:false};}
      case"scienceRule":{const cnt=req.subjects.filter(s=>completed.has(s)).length;const hasSH=completed.has(req.sciHumanSubject||"科学と人間生活");const needed=hasSH?1:(req.min||3);const ok=cnt>=needed;return{id:req.id,name:req.名称,ok,detail:`${cnt}科目取得/${needed}科目必要`,warning:!ok&&cnt===needed-1?"⚠️ あと1科目":null,urgent:false};}
      case"peCredits":{const ok=peCredits>=(req.min||7);const urgent=!ok&&peCredits===(req.min||7)-1;return{id:req.id,name:req.名称,ok,detail:`体育：${peCredits}単位/${req.min||7}単位必要`,warning:urgent?"🚨 あと1単位！":!ok&&peCredits>=(req.min||7)-2?`⚠️ あと${(req.min||7)-peCredits}単位`:null,urgent};}
      default:return{id:req.id,name:req.名称,ok:false,detail:"不明なタイプ",warning:null,urgent:false};
    }
  });
  const failCount=checks.filter(c=>!c.ok).length,urgentCount=checks.filter(c=>c.urgent).length;
  const prereqIssues=[];(DB.requirements?.段階学習||INITIAL_REQUIREMENTS.段階学習).forEach(req=>{req.解禁.forEach(unlocked=>{if(completed.has(unlocked)){const missing=req.前提.filter(p=>!completed.has(p));if(missing.length>0)prereqIssues.push({科目名:unlocked,前提不足:missing});}});});
  const 不認定科目=修得済み.filter(s=>s.認定===false);
  const status=urgentCount>0?"urgent":failCount>0?"danger":prereqIssues.length>0?"warning":"ok";
  return{checks,failCount,urgentCount,prereqIssues,不認定科目,completed,creditMap,peCredits,status};
}

  el.innerHTML=html;

// 修得状況変更後の受講登録整合性チェック
// ══════════════════════════════════════════════════════
function validateRegistrationAfterDataChange(student) {
  const reg = student.受講登録;
  if(!reg || !reg.科目リスト?.length) return [];
  const completedSet = new Set(
    (student.修得済み科目||[]).filter(s=>s.認定!==false&&s.科目名!=="体育").map(s=>s.科目名)
  );
  const prereqs = DB.requirements?.段階学習 || INITIAL_REQUIREMENTS.段階学習;
  const issues = [];
  for(const subj of reg.科目リスト) {
    // 修得済み科目の再登録チェック
    if(completedSet.has(subj)){
      issues.push({科目名:subj, 理由:`「${getAbbr(subj)}」は修得済みのため再受講不可`, severity:"error"}); continue;
    }
    // 入門講座の排他チェック
    if(subj==="数学入門講座"&&completedSet.has("数学Ⅰ")){
      issues.push({科目名:subj, 理由:"数学Ⅰ修得済のため数学入門講座は受講不可", severity:"error"}); continue;
    }
    if(subj==="英語入門講座"&&completedSet.has("英語コミュニケーションⅠ")){
      issues.push({科目名:subj, 理由:"英コミュⅠ修得済のため英語入門講座は受講不可", severity:"error"}); continue;
    }
    // 段階学習前提チェック
    for(const req of prereqs) {
      if(!req.解禁?.includes(subj)) continue;
      // allowConcurrent は同一登録内の科目も前提として認める
      const missing = req.allowConcurrent
        ? req.前提.filter(p=>!completedSet.has(p)&&!reg.科目リスト.includes(p))
        : req.前提.filter(p=>!completedSet.has(p));
      const isAnyOf = req.type==="anyOf";
      const metCount = req.前提.length - missing.length;
      const minMet = isAnyOf ? (req.min||1) : req.前提.length;
      if(metCount < minMet) {
        issues.push({科目名:subj, 理由:`「${getAbbr(subj)}」の前提「${req.前提.join("・")}」が未充足になりました`, severity:"error"});
      }
    }
  }
  return issues;
}

}
function saveStudent(){
  const s=_editingStudent;if(!s||!s.氏名.trim()){showToast("⚠️ 氏名を入力してください");return;}
  const no=document.getElementById("s-no")?.value.trim();const name=document.getElementById("s-name")?.value.trim();
  const grade=parseInt(document.getElementById("s-grade")?.value)||1;const cls=document.getElementById("s-cls")?.value||"";
  const pw=document.getElementById("s-pw")?.value||s.初期パスワード;const note=document.getElementById("s-note")?.value||"";
  // 既存の受講登録・担任確認情報を引き継ぐ
  const prevStudent = editingId ? DB.students.find(x=>x.id===editingId) : null;
  const record={id:editingId||uid(),生徒番号:no||s.生徒番号,氏名:name||s.氏名,フリガナ:s.フリガナ,学年:grade,クラス:cls,初期パスワード:pw,修得済み科目:s.修得済み科目,備考:note,更新日時:new Date().toISOString(),
    受講登録:prevStudent?.受講登録||null, 担任確認:prevStudent?.担任確認||false,
    担任確認日時:prevStudent?.担任確認日時||null, 担任メモ:prevStudent?.担任メモ||""};
  const v=validateStudent(record);
  if(v.urgentCount>0){if(!confirm("⚠️ 体育などで1単位不足の項目があります。このまま保存しますか？")){return;}}
  // ★ 修得状況変更後の受講登録整合性チェック
  let regIssues = [];
  if(editingId && record.受講登録) {
    regIssues = validateRegistrationAfterDataChange(record);
    if(regIssues.length > 0) {
      record.受講登録.dataChangeIssues = regIssues;
      record.受講登録.dataChangedAt = new Date().toISOString();
    } else {
      delete record.受講登録.dataChangeIssues;
      delete record.受講登録.dataChangedAt;
    }
  }
  if(editingId){const i=DB.students.findIndex(x=>x.id===editingId);DB.students[i]=record;}
  else DB.students.push(record);
  saveDB();closeModalBtn();renderPage();
  showToast(editingId?"✅ 生徒情報を更新しました":"✅ 生徒を追加しました");
  // 問題があればモーダルで通知

// 開講スケジュール CSV インポート / エクスポート
// ══════════════════════════════════════════════════════
// 条件区分 → 新CSVの「学年」「クラス」列に変換（逆引き用）
function condToSimple(s){
  switch(s.条件区分){
    case"all":           return{学年:"",クラス:""};
    case"mingrade":      return{学年:(s.minGrade||2)+"+",クラス:""};
    case"exactgrade":    return{学年:String(s.minGrade||2),クラス:""};
    case"grade1classes": return{学年:""     ,クラス:(s.classes||[]).join("")};
    case"grade1classes+min2":      return{学年:"2+",クラス:(s.classes||[]).join("")};
    case"grade1classes+exactgrade2":return{学年:"2" ,クラス:(s.classes||[]).join("")};
    default:             return{学年:"",クラス:""};
  }
}
// 「学年」「クラス」列 → 条件区分・minGrade・classes を自動判定
function simpleToCondition(学年str, classStr){
  const hasCls  = !!(classStr && classStr.trim());
  const hasGrade= !!(学年str  && 学年str.trim());
  const isMin   = 学年str && 学年str.includes("+");
  const gradeVal= hasGrade ? parseInt(学年str) : null;
  const classes = hasCls ? classStr.split("").filter(c=>"ABCDEFGHIJ".includes(c)) : [];
  if(!hasCls && !hasGrade) return{条件区分:"all",minGrade:null,classes:[]};
  if(!hasCls &&  hasGrade) return{条件区分:isMin?"mingrade":"exactgrade",minGrade:gradeVal,classes:[]};
  if( hasCls && !hasGrade) return{条件区分:"grade1classes",minGrade:null,classes};
  // both cls + grade
  return{条件区分:isMin?"grade1classes+min2":"grade1classes+exactgrade2",minGrade:gradeVal,classes};
}
function exportScheduleCSV(){
  // 新フォーマット: 条件区分 列を廃止し「学年」「クラス」で表現
  const header=["XY","period","科目名","奇偶","学年","クラス"];
  const rows=DB.schedules.map(s=>{
    const {学年,クラス}=condToSimple(s);
    return[s.XY,s.period,s.科目名,s.parity||"",学年,クラス];
  });
  downloadCSV("schedules",header,rows);
}
function importScheduleCSV(){
  pickFile([".csv"],(content)=>{
    let data;
    try{data=parseCSV(content);}catch(e){showToast("⚠️ CSVの解析に失敗: "+e.message);return;}
    if(!data.length){showToast("⚠️ データが空です");return;}
    const subjNames=new Set(getAllSubjects().map(s=>s.科目名));
    const VALID_PARITY=new Set(["odd","even",""]);
    // 新旧フォーマット両対応: 「条件区分」列があれば旧形式、なければ新形式（学年+クラス自動判定）
    const hasOldCond = Object.keys(data[0]||{}).includes("条件区分");
    const errs=[];
    data.forEach((r,i)=>{
      const row=i+2;
      if(!["X","Y"].includes(r["XY"]))errs.push(`行${row}: XY列が不正(${r["XY"]})`);
      if(!Number(r["period"])||Number(r["period"])<1||Number(r["period"])>6)errs.push(`行${row}: period列が不正(${r["period"]})`);
      if(!r["科目名"])errs.push(`行${row}: 科目名が空`);
      else if(!subjNames.has(r["科目名"]))errs.push(`行${row}: 科目マスタに存在しない「${r["科目名"]}」`);
    });
    if(errs.length&&!confirm(`⚠️ ${errs.length}件の問題:\n${errs.slice(0,8).join("\n")}${errs.length>8?"\n...他"+(errs.length-8)+"件":""}\n\n問題行を除いてインポートしますか？`))return;
    pushUndo();
    let added=0,skipped=0;
    data.forEach(r=>{
      if(!["X","Y"].includes(r["XY"])||!Number(r["period"])||!r["科目名"]||!subjNames.has(r["科目名"])){skipped++;return;}
      const xy=r["XY"],period=Number(r["period"]),科目名=r["科目名"];
      const parity=VALID_PARITY.has(r["奇偶"]||"")?r["奇偶"]||null:null;
      // 条件区分の解決: 旧形式(条件区分列あり) OR 新形式(学年+クラスから自動判定)
      let 条件区分,minGrade,classes;
      if(hasOldCond){
        const VALID_CONDS=new Set(["all","mingrade","exactgrade","grade1classes","grade1classes+min2","grade1classes+exactgrade2"]);
        条件区分=VALID_CONDS.has(r["条件区分"])?r["条件区分"]:"all";
        minGrade=r["学年"]?Number(r["学年"]):null;
        classes=r["クラス"]?r["クラス"].split("").filter(c=>"ABCDEFGHIJ".includes(c)):[];
      }else{
        // 新形式: 学年列（空=全員, "2+"=2年以上, "2"=2年のみ, "3"=3年のみ等）+ クラス列で自動判定
        const cond=simpleToCondition(r["学年"]||"",r["クラス"]||"");
        条件区分=cond.条件区分;minGrade=cond.minGrade;classes=cond.classes;
      }
      const label=(r["ラベル"]||"").trim()||generateLabel(科目名,parity,条件区分,minGrade,classes);
      const subj=getAllSubjects().find(s=>s.科目名===科目名);
      const entry={id:uid(),XY:xy,period,科目名,label,parity,条件区分,minGrade,classes};
      DB.schedules.push(entry);added++;
      if(subj?.syncXY){const ox=xy==="X"?"Y":"X";if(!DB.schedules.some(s=>s!==entry&&s.XY===ox&&s.period===period&&s.label===label)){DB.schedules.push({...entry,id:uid(),XY:ox});added++;}}
      if(subj?.syncConsec){const op=period<6?period+1:period-1;if(!DB.schedules.some(s=>s!==entry&&s.XY===xy&&s.period===op&&s.科目名===科目名)){const ce={...entry,id:uid(),period:op};DB.schedules.push(ce);added++;if(subj.syncXY){const ox=xy==="X"?"Y":"X";DB.schedules.push({...ce,id:uid(),XY:ox});added++;}}}
    });
    saveDB();renderPage();
    showToast(`✅ ${added}枠インポート（スキップ:${skipped}件）`);
  });
}

function downloadCSV(name,header,rows){const bom="\uFEFF";const csv=bom+[header,...rows].map(r=>r.map(v=>{const s=String(v??"");return/[,"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`${name}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);showToast(`⬇️ ${name}.csv をダウンロードしました`);}

function parseCSV(text){text=text.replace(/^\uFEFF/,"");const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw new Error("ヘッダー行とデータ行が必要です");const headers=parseCsvLine(lines[0]);return lines.slice(1).filter(l=>l.trim()).map(line=>{const vals=parseCsvLine(line);const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]??""});return obj;});}
function parseCsvLine(line){const result=[];let cur="";let inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===","&&!inQ){result.push(cur);cur="";}else cur+=ch;}result.push(cur);return result;}

function dndEnter(event,targetXY,targetPeriod,type){

function dndDrop(event,targetXY,targetPeriod,type){

  document.getElementById("modal-box").className="modal modal-xl";
  document.getElementById("modal-box").innerHTML=`<div class="modal-header"><div class="modal-title">🔍 データ整合性チェック結果（v15.2）</div><button class="close-btn" onclick="closeModalBtn()">✕</button></div><div class="modal-body"><div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">科目マスタ ${getAllSubjects().length}科目 / 開講スケジュール ${DB.schedules.length}件 / 生徒 ${DB.students.length}名 を確認しました</div>${issueHtml}</div><div class="modal-footer"><button class="btn btn-primary" onclick="runIntegrityCheck()">🔄 再チェック</button><button class="btn btn-outline" onclick="closeModalBtn()">閉じる</button></div>`;

function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2500);}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
